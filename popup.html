<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Tempster</title>
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <div class="header">
        <a href="https://github.com/miguelcemiller/tempster" target="_blank" title="tempster on github" class="header-link">
          <img src="/images/icon128.png" class="header-link-icon" />
          <img src="/images/tempster.png" class="header-link-text-icon" />
        </a>
      </div>

      <!-- alert -->
      <div class="alert">
        <div class="alert-value"></div>
        <svg class="close-alert" aria-hidden="true" height="16" viewBox="0 0 16 16" version="1.1" width="16" data-view-component="true" fill="#C93033" class="cursor-pointer hover:opacity-75">
          <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"></path>
        </svg>
      </div>

      <!-- template details -->
      <input type="text" placeholder="enter name" class="input-template-name" />
      <textarea placeholder="enter text content of template" class="textarea-template-text"></textarea>

      <div style="display: flex; gap: 6px">
        <!-- back -->
        <button title="Back" class="back btn-secondary">back</button>
        <!-- save template -->
        <button title="Save" class="save btn-primary" disabled="true">save</button>
      </div>

      <!-- templates list -->
      <div class="templates-list">
        <!-- load dynamically -->
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
